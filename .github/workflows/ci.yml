name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t revision:ci .

  # The other two projects in this repo. Neither is covered by the `test`
  # job above: pyproject sets testpaths = ["tests"], and ruff's
  # extend-exclude skips ezr/ and realm/. Every suite below is a plain
  # script that prints its own tally and exits non-zero on failure, so
  # nothing here needs pytest.
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 21, not 17: ezr/5-runtime-java uses pattern matching in switch,
      # which was a *preview* feature through 20 and only became final in
      # 21 (JEP 441). build.sh passes no --release, so it compiles against
      # whatever JDK is on PATH -- on 17 it fails with four "patterns in
      # switch statements are a preview feature" errors.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A missing toolchain does not fail these suites -- it makes them
      # quietly cover less and still exit 0. That is the whole reason this
      # step exists: without it a runner that lost a compiler would report
      # a green build for a smaller language.
      - name: Assert the toolchains are actually here
        run: |
          set -euo pipefail
          missing=0
          for t in gcc g++ python3 ruby javac java; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  ok      %s\n' "$t"
            else
              printf '  MISSING %s\n' "$t"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::A toolchain is absent. These suites would skip a layer and still pass."
            exit 1
          }
          jv="$(env -u JAVA_TOOL_OPTIONS javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)"
          printf '  javac major version: %s\n' "${jv:-unknown}"
          [ "${jv:-0}" -ge 21 ] 2>/dev/null || {
            echo "::error::ezr/5-runtime-java needs JDK 21+ (patterns in switch); found ${jv:-unknown}."
            exit 1
          }

      # tests/algebra_parity.py checks for 5-runtime-java/out, not just for
      # javac, so on a fresh checkout the Java arm skips and the suite still
      # reports green. Building here is what makes that arm real: measured
      # locally, it moves algebra parity from "3 agreed, 1 skipped" to
      # "4 agreed, 0 skipped".
      - name: Build the Java runtime
        working-directory: ezr/5-runtime-java
        run: ./build.sh

      - name: DIAG 1 — examples_test.py standalone, full output
        working-directory: ezr
        run: python3 tests/examples_test.py || echo "EXIT=$?"

      - name: DIAG 2 — full run_all.py (ignore result)
        working-directory: ezr
        run: python3 tests/run_all.py || echo "EXIT=$?"

      - name: DIAG 3 — examples_test.py again, after run_all
        working-directory: ezr
        run: python3 tests/examples_test.py || echo "EXIT=$?"
