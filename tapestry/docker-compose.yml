# Ever / Tapestry — services
# Codric Enterprise · Ricky (Dreid) · 2026

services:

  # Verify every layer. This is the one that finally covers Ruby and
  # Java, which the bare build container could not.
  verify:
    build: .
    image: codric/ever:2.3
    command: ./run.sh
    volumes:
      - ./archive:/ever/archive

  # The self-generating loop.
  evolve:
    build: .
    image: codric/ever:2.3
    command: python3 2-interpreter-python/vowels.py
    volumes:
      - ./archive:/ever/archive

  # The forge: sixteen front ends, run to convergence. Writes its
  # rulings to 7-forge/ratified.json and its record to ledger.json, so
  # mount the directory if you want the result to survive the run.
  forge:
    build: .
    image: codric/ever:2.3
    working_dir: /ever/7-forge
    command: python3 forge.py --reset --floor 250000
    volumes:
      - ./7-forge:/ever/7-forge

  # Re-emit GRAMMAR.ebnf from the parser's own rule table.
  grammar:
    build: .
    image: codric/ever:2.3
    working_dir: /ever/7-forge
    command: python3 grammar_doc.py
    volumes:
      - ./7-forge:/ever/7-forge

  # The research team: conservation law, ratios, defect profile.
  research:
    build: .
    image: codric/ever:2.3
    command: python3 research.py

  # Write and run Ever interactively.
  shell:
    build: .
    image: codric/ever:2.3
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/ever

  # The live interpreter, in a browser.
  live:
    build: .
    image: codric/ever:2.3
    command: python3 -m http.server 8088 --directory 6-interface-html
    ports:
      - "8088:8088"
