[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revision"
version = "0.1.0"
description = "ReVision — a Claude-powered document toolkit (analyze, enhance, translate, simplify)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReVision maintainers" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
revision = "revision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
