[project]
name = "accord-mcp"
version = "0.1.0"
description = "MCP tools over Accord: check, run, tac and build a program, deterministically."
requires-python = ">=3.11"
dependencies = ["mcp>=2", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A single-file server, not a package -- there is no accord_mcp/__init__.py to point hatchling
# at, so it is told the one file to ship.
include = ["server.py"]

# ruff finds the nearest pyproject.toml walking up from a file, so this one's presence would
# otherwise silently drop this directory to ruff's own 88-column defaults instead of the root's
# settings -- the same trap accord/ruff.toml exists to avoid (see CLAUDE.md). Mirrored exactly.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
